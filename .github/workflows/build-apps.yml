# Genera la app de Android (.apk) y la de Windows (.exe) cada vez que subes cambios,
# o a mano desde la pestaña Actions › "Generar apps" › Run workflow.
name: Generar apps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['README.md']

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install --no-audit --no-fund
      - run: node prepare.js
      - run: npx cap add android
      - name: Permisos para guardar en Documentos (Android 9 y 10)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <application android:requestLegacyExternalStorage="true"#' $M
      - name: Icono de la app
        continue-on-error: true
        run: |
          mkdir -p assets
          cp www/icons/icon-512.png assets/icon-only.png
          cp www/icons/icon-maskable-512.png assets/icon-foreground.png
          python3 -c "import zlib,struct;w=h=1024;raw=b''.join(b'\\x00'+b'\\xff'*3*w for _ in range(h));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff);open('assets/icon-background.png','wb').write(b'\\x89PNG\\r\\n\\x1a\\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw,9))+c(b'IEND',b''))"
          npx --yes @capacitor/assets@3.0.5 generate --android
      - name: Revisar ícono adaptable
        shell: bash
        run: |
          R=android/app/src/main/res
          if ! ls $R/mipmap-*/ic_launcher_background.* >/dev/null 2>&1 && ! ls $R/drawable*/ic_launcher_background.* >/dev/null 2>&1 && ! grep -rqs 'name="ic_launcher_background"' $R/values; then
            echo "Falta el fondo del ícono adaptable; se usa el ícono normal."
            rm -f $R/mipmap-anydpi-v26/ic_launcher.xml $R/mipmap-anydpi-v26/ic_launcher_round.xml
          fi
          grep -rl "mipmap/ic_launcher_background" $R/mipmap-anydpi-v26 2>/dev/null | while read f; do ls $R/mipmap-*/ic_launcher_background.png >/dev/null 2>&1 || rm -f "$f"; done || true
          ls $R/mipmap-anydpi-v26 $R/mipmap-hdpi 2>/dev/null || true
      - run: npx cap sync android
      - name: Compilar APK
        working-directory: app/android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1
          code=$?
          tail -n 80 build.log
          if [ $code -ne 0 ]; then
            awk '/What went wrong/{f=1} f{print; n++} n>12{exit}' build.log | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error title=Detalle::/'
            echo
            grep -nE "error:|ERROR:|e: |Exception|FAILED|AAPT|resource .* not found|Duplicate" build.log | grep -v "^.*> Task" | head -n 7 | while IFS= read -r l; do echo "::error title=Gradle::${l//%/%25}"; done
          fi
          exit $code
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Formatos-Soporte-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: Formatos-Soporte-Android, path: app/Formatos-Soporte-Android.apk }

  windows:
    runs-on: windows-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run build:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: Formatos-Soporte-Windows, path: app/dist/*.exe }
